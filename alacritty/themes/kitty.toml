[colors]
draw_bold_text_with_bright_colors = false

[colors.primary]
background = "#151515"
foreground = "#c0b18b"

[colors.cursor]
cursor = "#8fee96"
text = "#151515"

[colors.vi_mode_cursor]
cursor = "#8fee96"
text = "#151515"

[colors.selection]
background = "#d75f5f"
text = "#2f2f2f"

[colors.search.matches]
background = "#af865a"
foreground = "#151515"

[colors.search.focused_match]
background = "#8fee96"
foreground = "#151515"

# url_color #22c3a1
[colors.hints.start]
background = "#22c3a1"
foreground = "#151515"

[colors.hints.end]
background = "#2f2f2f"
