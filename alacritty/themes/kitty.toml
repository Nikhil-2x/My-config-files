[colors.bright]
black   = "#555555"
red     = "#d75f5f"
green   = "#8fee96"
yellow  = "#cd950c"
blue    = "#22c3a1"
magenta = "#775759"
cyan    = "#84edb9"
white   = "#d8d8d8"

