[colors]
draw_bold_text_with_bright_colors = false

[colors.primary]
background = "#1d2021"   # dark0_hard
foreground = "#ebdbb2"   # light1

[colors.cursor]
cursor = "#ebdbb2"
text = "#1d2021"

[colors.vi_mode_cursor]
cursor = "#fe8019"       # bright_orange
text = "#1d2021"

[colors.selection]
background = "#504945"   # dark2
text = "CellForeground"

[colors.search.matches]
background = "#fabd2f"
foreground = "#1d2021"

[colors.search.focused_match]
background = "#fe8019"
foreground = "#1d2021"

[colors.hints.start]
background = "#fabd2f"
foreground = "#1d2021"

[colors.hints.end]
background = "#3c3836"
foreground = "#fabd2f"

[colors.normal]
black   = "#1d2021"
red     = "#cc241d"
green   = "#98971a"
yellow  = "#d79921"
blue    = "#458588"
magenta = "#b16286"
cyan    = "#689d6a"
white   = "#a89984"

[colors.bright]
black   = "#928374"
red     = "#fb4934"
green   = "#b8bb26"
yellow  = "#fabd2f"
blue    = "#83a598"
magenta = "#d3869b"
cyan    = "#8ec07c"
white   = "#ebdbb2"

