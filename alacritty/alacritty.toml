general.import = [
  # "~/AppData/Roaming/alacritty/themes/catppuccin-mocha.toml"
   "~/AppData/Roaming/alacritty/themes/kitty.toml"
   # "~/AppData/Roaming/alacritty/themes/gruvbox.toml"

]

general.working_directory = "C:\\Users\\dell"

[window]
# Slightly more comfortable padding
padding = { x = 8, y = 8 }
dimensions = { columns = 140, lines = 30 }
opacity = 0.95
blur = true
decorations = "full"


# Don't let Windows resize the terminal text in weird ways
dynamic_padding = true

[cursor]
blink_interval = 500            # cursor_blink_interval 0.5
blink_timeout = 15              # cursor_stop_blinking_after 15
unfocused_hollow = true
thickness = 0.15                # beam/underline thickness (kitty: 2.0pt)

[cursor.style]
shape = "Block"                 # cursor_shape block
blinking = "On"                 # blink by default, apps may override

[mouse]
hide_when_typing = false        # mouse_hide_wait 0.0




[font]
# JetBrainsMono Nerd Font
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
bold = { family = "JetBrainsMono Nerd Font", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font", style = "Italic" }
bold_italic = { family = "JetBrainsMono Nerd Font", style = "Bold Italic" }

# Increase font size as desired
size = 11.5

# Increase vertical spacing
offset = { x = 0, y = 2 }

[terminal]
shell = { program = "nu.exe" }

