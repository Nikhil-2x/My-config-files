set -g default-shell "C:\\Users\\dell\\AppData\\Local\\Programs\\nu\\bin\\nu.exe"

set -g default-terminal "screen-256color" # Set terminal type for 256-color support
set -ga terminal-overrides ",*256col*:Tc" # Override to enable true-color for compatible terminals

set -g set-clipboard on
set -g mouse on
set -g allow-passthrough on
set-option -g status-position top

unbind C-b
set -g prefix C-a
# bind C-a send-prefix


unbind r
bind r source-file ~/.tmux.conf

unbind %
bind | split-window -h

unbind \"
bind - split-window -v

bind c new-window

set-window-option -g mode-keys vi

bind-key h select-pane -L
bind-key l select-pane -R
bind-key j select-pane -D
bind-key k select-pane -U


set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on


#Style
set -g @gray_light "#E7E7E7"
set -g @gray_medium "#ABB2BF"
set -g @gray_dark "#3B4252"
set -g @green_soft "#A3BE8C"
set -g @blue_muted "#81A1C1"
set -g @cyan_soft "#88C0D0"


# Status bar — left
set -g status-left-length 100
set -g status-style "fg=#{@gray_light},bg=default"
set -g status-left "#[fg=#{@green_soft},bold] #S #[fg=#{@gray_light},nobold] | "


set -g window-status-current-format "#[fg=#{@cyan_soft},bold]  #[underscore]#I:#W#[nounderscore]#{?window_zoomed_flag, 󰍋 ,}"
set -g window-status-format " #I:#W"
set -g message-style "fg=#{@gray_light},bg=default"
set -g mode-style "fg=#{@gray_dark},bg=#{@blue_muted}"
set -g pane-border-style "fg=#{@gray_dark}"
set -g pane-active-border-style "fg=#{@green_soft}"

# Status bar — Right
set -g status-right-length 100
set -g status-right \
    "#[fg=#{@cyan_soft}]󰃰 %d %b  #[fg=#{@gray_dark}]│  #[fg=#{@green_soft}]󰥔 %H:%M "
